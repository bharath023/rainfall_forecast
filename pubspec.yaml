name: rainfall_app
description: Global multi-model rainfall forecast (ECMWF, AIFS, GFS, ICON, GEM, JMA + ensembles).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  fl_chart: ^0.69.0
  intl: ^0.19.0
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
